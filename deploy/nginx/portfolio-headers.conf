# /etc/nginx/snippets/portfolio-headers.conf — security headers for ismayilovilkin.online (PLAN.md §12).
# Included in every location: nginx drops server-level add_header lines in a location that has its own.
#
# CSP: Astro puts the full policy (script/style hashes) in a <meta> tag on every page. Browsers enforce both
# policies, so this header only adds what a <meta> CSP cannot carry (frame-ancestors) plus directives that repeat
# the meta values exactly. It has no script-src/style-src, so it can never block what the meta policy allows.
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
# HSTS: enabled 2026-10-24 after HTTPS was verified for both hostnames. 1 year, no preload.
# The HTTP-only bootstrap config must never be used again once this is live.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
