# /etc/nginx/sites-available/ismayilovilkin.online — BOOTSTRAP version, used until the certificate exists.
# Serves the site over plain HTTP so it can be checked and so Let's Encrypt can reach /.well-known/acme-challenge/.
# Replaced by ismayilovilkin.online.conf (HTTPS, redirects) once certbot has issued the certificate.

server {
    listen 80;
    listen [::]:80;
    server_name ismayilovilkin.online www.ismayilovilkin.online;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    root /var/www/portfolio/current;
    include snippets/portfolio-site.conf;
}

# Health check for a new release before it goes live: reachable only from the server itself.
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root /var/www/portfolio/next;
    include snippets/portfolio-site.conf;
}
