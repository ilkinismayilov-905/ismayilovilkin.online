# /etc/nginx/sites-available/ismayilovilkin.online — FINAL version (after the certificate is issued).
# Implements PLAN.md §12: http → https, www → apex, localized 404s, compression, cache rules, security headers.
# Certificate: certbot certonly --webroot (see README "Certificates"); renewal reloads nginx via a deploy hook.

# Plain HTTP: only the ACME challenge, everything else → https://ismayilovilkin.online (path and query kept)
server {
    listen 80;
    listen [::]:80;
    server_name ismayilovilkin.online www.ismayilovilkin.online;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://ismayilovilkin.online$request_uri;
    }
}

# https://www → https://apex
server {
    # nginx 1.24 (Ubuntu 24.04): http2 is a listen parameter; the `http2 on;` directive needs ≥ 1.25.1
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ismayilovilkin.online;

    ssl_certificate     /etc/letsencrypt/live/ismayilovilkin.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ismayilovilkin.online/privkey.pem;
    include snippets/portfolio-tls.conf;

    include snippets/portfolio-headers.conf;
    return 301 https://ismayilovilkin.online$request_uri;
}

# The site
server {
    # nginx 1.24 (Ubuntu 24.04): http2 is a listen parameter; the `http2 on;` directive needs ≥ 1.25.1
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ismayilovilkin.online;

    ssl_certificate     /etc/letsencrypt/live/ismayilovilkin.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ismayilovilkin.online/privkey.pem;
    include snippets/portfolio-tls.conf;

    root /var/www/portfolio/current;
    include snippets/portfolio-site.conf;
}

# Health check for a new release before it goes live: reachable only from the server itself.
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root /var/www/portfolio/next;
    include snippets/portfolio-site.conf;
}
