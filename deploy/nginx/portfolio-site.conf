# /etc/nginx/snippets/portfolio-site.conf — how the static build is served. Included by the live site
# (root …/current) and by the localhost health-check server (root …/next), so both behave identically.
#
# Astro output: build.format 'directory' + trailingSlash 'always' → /work/milly/ is /work/milly/index.html.
# No try_files: nginx's static module then serves files, serves index.html for "/dir/", answers "/dir" with a
# 301 to "/dir/" when the directory exists, and returns 404 otherwise. That is exactly the site's URL scheme.
index index.html;
absolute_redirect off;   # relative Location on the slash redirect: no scheme/port guessing
server_tokens off;
charset utf-8;
charset_types text/css application/javascript application/json application/xml text/plain image/svg+xml;

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types text/css application/javascript application/json application/xml text/plain image/svg+xml;
brotli on;
brotli_comp_level 6;
brotli_min_length 512;
brotli_types text/css application/javascript application/json application/xml text/plain image/svg+xml;

# Localized not-found pages (status stays 404)
error_page 404 /404.html;

# Hashed build assets: content-addressed, safe to cache for a year
location /_astro/ {
    include snippets/portfolio-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Unhashed static files that rarely change
location /og/ {
    include snippets/portfolio-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
}
location = /favicon.svg {
    include snippets/portfolio-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
}

# Azerbaijani pages: Azerbaijani 404
location /az/ {
    error_page 404 /az/404.html;
    include snippets/portfolio-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
}

# Everything else (HTML, sitemaps, robots.txt): always revalidate
location / {
    include snippets/portfolio-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
}
